<body class="bg-background text-on-background h-full flex items-center justify-center font-body-md">
<div class="w-full max-w-md p-margin-mobile md:p-margin-desktop bg-surface border border-outline-variant">
<div class="text-center mb-stack-lg">
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-primary tracking-tighter mb-stack-sm">FreelanceLedger</h1>
<p class="font-body-md text-body-md text-secondary">The financial operating system for the modern Indian freelancer.</p>
</div>
<form class="space-y-stack-md" id="auth-form">
<div class="hidden space-y-stack-md" id="signup-fields">
<div>
<label class="block font-label-caps text-label-caps text-on-surface mb-stack-sm" for="fullName">Full Name</label>
<input class="w-full border-0 border-b border-outline-variant bg-transparent focus:ring-0 focus:border-primary px-0 py-unit font-body-md text-body-md text-on-surface transition-colors" id="fullName" type="text"/>
</div>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface mb-stack-sm" for="email">Email Address</label>
<input class="w-full border-0 border-b border-outline-variant bg-transparent focus:ring-0 focus:border-primary px-0 py-unit font-body-md text-body-md text-on-surface transition-colors" id="email" required="" type="email"/>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface mb-stack-sm" for="password">Password</label>
<input class="w-full border-0 border-b border-outline-variant bg-transparent focus:ring-0 focus:border-primary px-0 py-unit font-body-md text-body-md text-on-surface transition-colors" id="password" required="" type="password"/>
</div>
<div class="hidden" id="confirm-password-field">
<label class="block font-label-caps text-label-caps text-on-surface mb-stack-sm" for="confirmPassword">Confirm Password</label>
<input class="w-full border-0 border-b border-outline-variant bg-transparent focus:ring-0 focus:border-primary px-0 py-unit font-body-md text-body-md text-on-surface transition-colors" id="confirmPassword" type="password"/>
</div>
<div class="flex items-center justify-between" id="login-options">
<label class="flex items-center">
<input class="rounded-none border-outline-variant text-primary focus:ring-primary bg-transparent" type="checkbox"/>
<span class="ml-2 font-body-md text-body-md text-secondary">Remember me</span>
</label>
<a class="font-body-md text-body-md text-primary underline decoration-1 underline-offset-2" href="#">Forgot Password?</a>
</div>
<button class="w-full bg-primary text-on-primary py-3 px-4 font-body-md text-body-md rounded-none hover:bg-surface-tint transition-colors" id="submit-btn" type="submit">
                Sign In
            </button>
</form>
<div class="mt-stack-md text-center">
<button class="font-body-md text-body-md text-secondary hover:text-primary transition-colors bg-transparent border-none cursor-pointer" id="toggle-mode-btn">
                Don't have an account? <span class="underline decoration-1 underline-offset-2 text-primary">Sign Up</span>
</button>
</div>
<div class="mt-stack-lg pt-stack-md border-t border-outline-variant text-center">
<button class="w-full bg-transparent text-primary py-3 px-4 border border-primary font-body-md text-body-md rounded-none hover:bg-surface-container-low transition-colors" id="demo-btn">
                Continue with Demo Account
            </button>
</div>
</div>
<script>
        const form = document.getElementById('auth-form');
        const submitBtn = document.getElementById('submit-btn');
        const toggleBtn = document.getElementById('toggle-mode-btn');
        const demoBtn = document.getElementById('demo-btn');
        const signupFields = document.getElementById('signup-fields');
        const confirmPasswordField = document.getElementById('confirm-password-field');
        const loginOptions = document.getElementById('login-options');
        
        let isLogin = true;

        toggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            isLogin = !isLogin;
            
            if (isLogin) {
                signupFields.classList.add('hidden');
                confirmPasswordField.classList.add('hidden');
                loginOptions.classList.remove('hidden');
                submitBtn.textContent = 'Sign In';
                toggleBtn.innerHTML = `Don't have an account? <span class="underline decoration-1 underline-offset-2 text-primary">Sign Up</span>`;
            } else {
                signupFields.classList.remove('hidden');
                confirmPasswordField.classList.remove('hidden');
                loginOptions.classList.add('hidden');
                submitBtn.textContent = 'Create Account';
                toggleBtn.innerHTML = `Already have an account? <span class="underline decoration-1 underline-offset-2 text-primary">Sign In</span>`;
            }
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            // Simulate auth and redirect
            localStorage.setItem('isAuthenticated', 'true');
            alert('Authentication successful. Redirecting to Dashboard (Dashboard not implemented in this snippet).');
            // window.location.href = '/dashboard';
        });

        demoBtn.addEventListener('click', () => {
             localStorage.setItem('isAuthenticated', 'true');
             localStorage.setItem('isDemo', 'true');
             alert('Demo account activated. Redirecting to Dashboard.');
             // window.location.href = '/dashboard';
        });

        // Basic check for authenticated state (to redirect away from auth page)
        if (localStorage.getItem('isAuthenticated') === 'true') {
             // window.location.href = '/dashboard';
        }

    </script>
