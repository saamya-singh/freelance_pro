<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clients CRM — FreelancePro</title>
  
  <link rel="stylesheet" href="../css/global.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            brandBlue: { 500: '#3B82F6', 600: '#2563EB', 700: '#1D4ED8' }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <script src="../js/core/theme.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-50 antialiased transition-colors duration-200">

  <div class="flex min-h-screen">
    <aside id="app-sidebar"></aside>

    <main class="flex-1 md:ml-[250px] flex flex-col min-w-0 pb-20 md:pb-8">
      <header id="app-header"></header>

      <div class="p-6 md:p-8 max-w-7xl w-full mx-auto space-y-8 animate-fade-in-up">
        <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 pb-4 border-b border-slate-200 dark:border-slate-800">
          <div>
            <h1 class="text-3xl font-extrabold tracking-tight">Clients</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Manage client profiles, contact people, GSTIN details, and outstanding balances.</p>
          </div>
          <div>
            <button class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-xs rounded-full border-2 border-slate-900 shadow-[3px_3px_0px_0px_rgba(15,23,42,1)] hover:-translate-y-0.5 transition-all" id="add-client-btn">+ Add Client</button>
          </div>
        </div>

        <!-- Filter & Search Bar -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 bg-white dark:bg-slate-900 p-4 border-2 border-slate-900 dark:border-slate-800 rounded-3xl shadow-[3px_3px_0px_0px_rgba(15,23,42,1)]">
          <div class="relative flex-1 sm:max-w-md">
            <input type="text" id="client-search-input" class="w-full pl-9 pr-4 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-full text-xs font-medium focus:outline-none focus:border-blue-600" placeholder="Search clients by name, company, or email..." />
            <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          </div>

          <div class="flex items-center gap-1.5 bg-slate-100 dark:bg-slate-950 p-1 rounded-full border border-slate-200 dark:border-slate-800">
            <button class="filter-tab-btn active px-4 py-1.5 bg-white dark:bg-slate-900 text-blue-600 dark:text-blue-400 font-extrabold text-xs rounded-full shadow-sm" data-filter="all">All Clients</button>
            <button class="filter-tab-btn px-4 py-1.5 text-slate-600 dark:text-slate-400 font-bold text-xs rounded-full" data-filter="active">Active</button>
            <button class="filter-tab-btn px-4 py-1.5 text-slate-600 dark:text-slate-400 font-bold text-xs rounded-full" data-filter="inactive">Inactive</button>
          </div>
        </div>

        <!-- Client Data Table Container -->
        <div id="clients-table-container"></div>
      </div>
    </main>
  </div>

  <!-- Mobile Bottom Nav -->
  <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t-2 border-slate-900 dark:border-slate-800 px-6 py-2.5 flex justify-between items-center z-50">
    <a href="dashboard.html" class="flex flex-col items-center gap-0.5 text-slate-500 font-bold text-[10px]">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span>Home</span>
    </a>
    <a href="invoices.html" class="flex flex-col items-center gap-0.5 text-slate-500 font-bold text-[10px]">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      <span>Invoices</span>
    </a>
    <a href="clients.html" class="px-4 py-1.5 bg-lime-400 text-slate-950 font-extrabold border-2 border-slate-900 rounded-full shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] flex items-center gap-1.5 text-xs">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
      <span>Clients</span>
    </a>
    <a href="tax.html" class="flex flex-col items-center gap-0.5 text-slate-500 font-bold text-[10px]">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
      <span>Wallet</span>
    </a>
  </div>

  <!-- Core Scripts -->
  <script src="../js/data/demo-data.js"></script>
  <script src="../js/data/tax-slabs.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/utils.js"></script>
  <script src="../js/core/validators.js"></script>
  <script src="../js/core/notifications.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/state.js"></script>
  <script src="../js/core/router.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/confirm-dialog.js"></script>
  <script src="../js/components/table.js"></script>
  <script src="../js/components/command-palette.js"></script>
  <script src="../js/core/app.js"></script>

  <script src="../js/pages/clients.js"></script>
</body>
</html>
