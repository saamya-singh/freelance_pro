<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — FreelanceLedger India</title>
  
  <link rel="stylesheet" href="../css/global.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            brandBlue: { 500: '#3B82F6', 600: '#2563EB', 700: '#1D4ED8' }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <script src="../js/core/theme.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-50 antialiased min-h-screen flex items-center justify-center p-6 transition-colors duration-200">

  <div class="w-full max-w-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
    <div class="text-center">
      <a href="../index.html" class="inline-flex items-center gap-2 mb-4">
        <svg class="w-8 h-8" viewBox="0 0 100 100" fill="none">
          <path d="M20 20 H60 V35 H35 V45 H55 V60 H35 V80 H20 Z" fill="#2563EB"/>
          <path d="M45 45 H80 V60 H60 V80 H45 Z" fill="#84CC16"/>
        </svg>
        <span class="font-extrabold text-lg tracking-tight text-slate-900 dark:text-slate-100">FREELANCER<span class="text-blue-600">.OS</span></span>
      </a>
      <h1 class="text-2xl font-extrabold tracking-tight mt-2">Welcome back</h1>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Log in to manage clients, invoices and taxes.</p>
    </div>

    <div id="login-error-alert" class="hidden p-3 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900 text-red-600 dark:text-red-400 rounded-xl text-xs font-semibold">
      Invalid email or password.
    </div>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Email Address <span class="text-red-500">*</span></label>
        <input type="email" id="login-email" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-sm font-semibold focus:outline-none focus:border-blue-600" placeholder="you@domain.in" value="" required />
      </div>

      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300">Password <span class="text-red-500">*</span></label>
          <a href="forgot-password.html" class="text-[11px] font-semibold text-blue-600 dark:text-blue-400 hover:underline">Forgot password?</a>
        </div>
        <div class="relative">
          <input type="password" id="login-password" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-sm font-semibold focus:outline-none focus:border-blue-600 pr-16" placeholder="••••••••" value="" required />
          <button type="button" id="toggle-password-btn" class="absolute right-3 top-3 text-xs font-bold text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">Show</button>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <input type="checkbox" id="login-remember" checked class="rounded border-slate-300 text-blue-600 focus:ring-blue-500" />
        <label for="login-remember" class="text-xs font-medium text-slate-500 cursor-pointer">Remember this browser</label>
      </div>

      <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-sm rounded-full shadow-lg shadow-blue-500/25 transition-all">Sign In →</button>
    </form>

    <div class="relative flex items-center justify-center my-4">
      <div class="border-t border-slate-200 dark:border-slate-800 w-full"></div>
      <span class="bg-white dark:bg-slate-900 px-3 text-[10px] font-bold uppercase tracking-wider text-slate-400 absolute">OR DEMO ACCESS</span>
    </div>

    <button type="button" id="demo-login-btn" class="w-full py-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-900 dark:text-slate-100 font-extrabold text-sm rounded-full transition-all">
      Continue with Demo Account
    </button>

    <div class="text-center text-xs text-slate-500 pt-2">
      Don't have an account? <a href="signup.html" class="font-bold text-blue-600 dark:text-blue-400 hover:underline">Sign Up</a>
    </div>
  </div>

  <!-- Core Scripts -->
  <script src="../js/data/demo-data.js"></script>
  <script src="../js/data/tax-slabs.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/utils.js"></script>
  <script src="../js/core/validators.js"></script>
  <script src="../js/core/notifications.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/pages/login.js"></script>
</body>
</html>
