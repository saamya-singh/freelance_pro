<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — FreelanceLedger India</title>
  
  <link rel="stylesheet" href="../css/global.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            brandBlue: { 500: '#3B82F6', 600: '#2563EB', 700: '#1D4ED8' }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <script src="../js/core/theme.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-50 antialiased min-h-screen flex items-center justify-center p-6 transition-colors duration-200">

  <div class="w-full max-w-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
    <div class="text-center">
      <a href="../index.html" class="inline-flex items-center gap-2 mb-4">
        <div class="w-9 h-9 bg-blue-600 text-white rounded-xl flex items-center justify-center font-extrabold text-sm shadow-md shadow-blue-500/20">FL</div>
        <span class="font-extrabold text-lg tracking-tight text-slate-900 dark:text-slate-100">FREELANCER<span class="text-blue-600">.OS</span></span>
      </a>
      <h1 class="text-2xl font-extrabold tracking-tight mt-2">Start your account</h1>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Join independent professionals managing finances with clarity.</p>
    </div>

    <form id="signup-form" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Full Name <span class="text-red-500">*</span></label>
        <input type="text" id="signup-name" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-sm font-semibold focus:outline-none focus:border-blue-600" placeholder="e.g. Vikramaditya Rao" required />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Work Email <span class="text-red-500">*</span></label>
        <input type="email" id="signup-email" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-sm font-semibold focus:outline-none focus:border-blue-600" placeholder="vikram@studio.in" required />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Password <span class="text-red-500">*</span></label>
        <input type="password" id="signup-password" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-sm font-semibold focus:outline-none focus:border-blue-600" placeholder="Create a strong password" required />
        
        <!-- Live Password Strength Meter -->
        <div class="password-meter-container mt-2">
          <div class="password-strength-label flex justify-between text-xs font-bold mb-1">
            <span>Strength:</span>
            <span id="strength-label" class="text-slate-400">Very Weak</span>
          </div>
          <div class="password-meter-bar h-1 bg-slate-200 dark:bg-slate-800 rounded flex gap-1 mb-2">
            <div class="meter-segment flex-1 h-full rounded transition-all"></div>
            <div class="meter-segment flex-1 h-full rounded transition-all"></div>
            <div class="meter-segment flex-1 h-full rounded transition-all"></div>
            <div class="meter-segment flex-1 h-full rounded transition-all"></div>
          </div>
          <ul class="password-requirements text-[11px] text-slate-400 space-y-0.5">
            <li class="requirement-item" id="req-length"><span class="req-icon">○</span> At least 8 characters</li>
            <li class="requirement-item" id="req-uppercase"><span class="req-icon">○</span> One uppercase letter</li>
            <li class="requirement-item" id="req-lowercase"><span class="req-icon">○</span> One lowercase letter</li>
            <li class="requirement-item" id="req-number"><span class="req-icon">○</span> One number</li>
            <li class="requirement-item" id="req-special"><span class="req-icon">○</span> One special character (!@#$)</li>
          </ul>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Confirm Password <span class="text-red-500">*</span></label>
        <input type="password" id="signup-confirm-password" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-sm font-semibold focus:outline-none focus:border-blue-600" placeholder="Re-enter password" required />
      </div>

      <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-sm rounded-full shadow-lg shadow-blue-500/25 transition-all">Create Account →</button>
    </form>

    <div class="text-center text-xs text-slate-500 pt-2">
      Already have an account? <a href="login.html" class="font-bold text-blue-600 dark:text-blue-400 hover:underline">Sign In</a>
    </div>
  </div>

  <!-- Core Scripts -->
  <script src="../js/data/demo-data.js"></script>
  <script src="../js/data/tax-slabs.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/utils.js"></script>
  <script src="../js/core/validators.js"></script>
  <script src="../js/core/notifications.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/pages/signup.js"></script>
</body>
</html>
