<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — FreelanceLedger India</title>
  
  <link rel="stylesheet" href="../css/global.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            brandBlue: { 500: '#3B82F6', 600: '#2563EB', 700: '#1D4ED8' }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <script src="../js/core/theme.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-50 antialiased min-h-screen flex items-center justify-center p-6 transition-colors duration-200">

  <div class="w-full max-w-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
    <div class="text-center">
      <a href="../index.html" class="inline-flex items-center gap-2 mb-4">
        <div class="w-9 h-9 bg-blue-600 text-white rounded-xl flex items-center justify-center font-extrabold text-sm shadow-md shadow-blue-500/20">FL</div>
        <span class="font-extrabold text-lg tracking-tight text-slate-900 dark:text-slate-100">FREELANCER<span class="text-blue-600">.OS</span></span>
      </a>
      <h1 class="text-2xl font-extrabold tracking-tight mt-2">Reset password</h1>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Enter your email to receive password reset instructions.</p>
    </div>

    <div id="reset-success-alert" class="hidden p-3 bg-green-50 dark:bg-green-950/40 border border-green-200 dark:border-green-900 text-green-700 dark:text-green-300 rounded-xl text-xs font-semibold">
      Password reset instructions have been sent to your email address (simulated prototype flow).
    </div>

    <form id="forgot-password-form" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Email Address <span class="text-red-500">*</span></label>
        <input type="email" id="forgot-email" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-sm font-semibold focus:outline-none focus:border-blue-600" placeholder="you@domain.in" required />
      </div>

      <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-sm rounded-full shadow-lg shadow-blue-500/25 transition-all">Send Reset Link →</button>
    </form>

    <div class="text-center text-xs text-slate-500 pt-2">
      Remembered your password? <a href="login.html" class="font-bold text-blue-600 dark:text-blue-400 hover:underline">Back to Login</a>
    </div>
  </div>

  <!-- Core Scripts -->
  <script src="../js/data/demo-data.js"></script>
  <script src="../js/data/tax-slabs.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/utils.js"></script>
  <script src="../js/core/validators.js"></script>
  <script src="../js/core/notifications.js"></script>
  <script src="../js/core/auth.js"></script>
  <script>
    document.getElementById('forgot-password-form').onsubmit = (e) => {
      e.preventDefault();
      const email = document.getElementById('forgot-email').value;
      if (Validators.isValidEmail(email)) {
        document.getElementById('reset-success-alert').classList.remove('hidden');
        Toast.success('Reset link sent!');
      } else {
        Toast.error('Please enter a valid email.');
      }
    };
  </script>
</body>
</html>
