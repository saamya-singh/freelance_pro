<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tax Settings — FreelanceLedger India</title>
  
  <link rel="stylesheet" href="../css/global.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            brandBlue: { 500: '#3B82F6', 600: '#2563EB', 700: '#1D4ED8' }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <script src="../js/core/theme.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-50 antialiased transition-colors duration-200">

  <div class="flex min-h-screen">
    <aside id="app-sidebar"></aside>

    <main class="flex-1 md:ml-[250px] flex flex-col min-w-0 pb-12">
      <header id="app-header"></header>

      <div class="p-6 md:p-8 max-w-7xl w-full mx-auto space-y-8">
        <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 pb-4 border-b border-slate-200 dark:border-slate-800">
          <div>
            <h1 class="text-3xl font-extrabold tracking-tight">Tax Settings & Regime Configuration</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Customize Indian Tax Regimes, standard deduction limits, and slab rates.</p>
          </div>
          <div class="flex items-center gap-3">
            <button class="px-4 py-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 text-xs font-extrabold rounded-full" id="reset-tax-settings-btn">Reset Defaults</button>
            <button class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-extrabold rounded-full shadow-lg shadow-blue-500/25" id="save-tax-settings-btn">Save Tax Configuration</button>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-sm space-y-4">
            <h3 class="text-xs font-extrabold text-slate-400 uppercase tracking-wider">General Tax Parameters</h3>

            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Default Tax Regime</label>
              <select id="tax-default-regime" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-sm font-semibold focus:outline-none focus:border-blue-600">
                <option value="new">New Tax Regime (Section 115BAC - Default)</option>
                <option value="old">Old Tax Regime (With Chapter VI-A Deductions)</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Standard Deduction — New Regime (₹)</label>
              <input type="number" id="tax-std-new" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-sm font-semibold focus:outline-none focus:border-blue-600" value="75000" />
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Standard Deduction — Old Regime (₹)</label>
              <input type="number" id="tax-std-old" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-sm font-semibold focus:outline-none focus:border-blue-600" value="50000" />
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Health & Education Cess (%)</label>
              <input type="number" step="0.5" id="tax-cess-rate" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-sm font-semibold focus:outline-none focus:border-blue-600" value="4" />
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-sm">
            <h3 class="text-xs font-extrabold text-slate-400 uppercase tracking-wider mb-4">Active Slabs — New Tax Regime</h3>
            <div id="new-regime-slabs-container"></div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Core Scripts -->
  <script src="../js/data/demo-data.js"></script>
  <script src="../js/data/tax-slabs.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/utils.js"></script>
  <script src="../js/core/validators.js"></script>
  <script src="../js/core/notifications.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/state.js"></script>
  <script src="../js/core/router.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/confirm-dialog.js"></script>
  <script src="../js/components/table.js"></script>
  <script src="../js/components/command-palette.js"></script>
  <script src="../js/core/app.js"></script>

  <script src="../js/pages/tax-settings.js"></script>
</body>
</html>
