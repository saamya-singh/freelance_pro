<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice Printable View — FreelanceLedger India</title>
  
  <link rel="stylesheet" href="../css/global.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            brandBlue: { 500: '#3B82F6', 600: '#2563EB', 700: '#1D4ED8' }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <script src="../js/core/theme.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-50 antialiased transition-colors duration-200">

  <div class="flex min-h-screen">
    <aside id="app-sidebar"></aside>

    <main class="flex-1 md:ml-[250px] flex flex-col min-w-0 pb-12">
      <header id="app-header"></header>

      <div class="p-6 md:p-8 max-w-5xl w-full mx-auto space-y-6">
        <div class="no-print flex items-center justify-between">
          <a href="invoices.html" class="text-xs font-bold text-blue-600 dark:text-blue-400 hover:underline flex items-center gap-1">
            ← Back to Invoices
          </a>
          <button class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-xs rounded-full shadow-lg shadow-blue-500/25 transition-all" id="print-invoice-btn">
            🖨️ Print / Download PDF
          </button>
        </div>

        <!-- Printable Document Container -->
        <div id="printable-invoice-document" class="invoice-document bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 sm:p-12 shadow-xl transition-colors"></div>
      </div>
    </main>
  </div>

  <!-- Core Scripts -->
  <script src="../js/data/demo-data.js"></script>
  <script src="../js/data/tax-slabs.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/utils.js"></script>
  <script src="../js/core/validators.js"></script>
  <script src="../js/core/notifications.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/state.js"></script>
  <script src="../js/core/router.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/confirm-dialog.js"></script>
  <script src="../js/components/command-palette.js"></script>
  <script src="../js/core/app.js"></script>

  <script src="../js/pages/invoice-detail.js"></script>
</body>
</html>
